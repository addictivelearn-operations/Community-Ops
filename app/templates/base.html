<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Community Ops{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Community Ops</a>
  {% if user %}
  <nav>
    <a href="/refunds">Refunds</a>
    <a href="/replies">Ticket replies</a>
    <a href="/diagnostics">Diagnostics</a>
  </nav>
  <form method="post" action="/logout" class="who">
    <span>{{ user.display }} · {{ user.email }} · {{ 'editor' if can_edit else 'view-only' }}</span>
    <button class="link">Sign out</button>
  </form>
  {% endif %}
</header>
<main>
  {% if msg %}<div class="flash {{ 'ok' if ok else 'bad' }}">{{ msg }}</div>{% endif %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
